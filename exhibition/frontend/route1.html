<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/route.css">
    <script src="js/link.js"></script>
    <script src="js/route1.js"></script>
    <title>AR遊戲集點</title>
    <style>
        .test {
            /* 讓標題區塊與按鈕/圖片區塊有間距 */
            margin-bottom: 1vh;  
            margin-top: 10vh;
            position: relative;
        }
        .test .h1-1, .test .h2-1 {
            margin-top: 1vh;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('./media/vendor_icons/BG_4.png');
            background-size: 100% 100%;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background-image: url('img/back.png');
            background-size: cover;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .status-pass {
            background-image: url('media/vendor_icons/correct.png');
        }

        .status-fail {
            background-image: url('media/vendor_icons/wrong.png');
        }

        /* 手機大小 */
        @media (min-width: 320px) and (max-width: 480px) {
            body {
                background-image: url('./media/vendor_icons/BG_4.png');
            }

            .back-button {
                position: fixed;
                left: 10px;
                width: 100px;
                height: 100px;
                background-image: url('./media/vendor_icons/Back.png');
            }

            .container {
                padding: 10px;
            }

            h1,
            h2 {
                text-align: center;
                color: #333;
            }

            .h1-1 {
                font-size: 23px;
                color: #FFF7E0;
                font-weight: bold;
            }

            .h2-1 {
                font-size: 20px;
                color: #FFF7E0;
                font-weight: bold;
            }
        }
        
        /* 平板大小 */
        @media (min-width: 481px) and (max-width: 767px) {
            body {
                background-image: url('./media/vendor_icons/BG_4.png');
            }

            .back-button {
                position: fixed;
                top: 10px;
                left: 10px;
                width: 100px;
                height: 100px;
                background-image: url('./media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png');
            }
            .container {
                padding: 20px;
                border-radius: 5px;
                text-align: center;
                width: 100%;
                max-width: 375px;

                position: relative;
                top: 35px;

            .h1-1 {
                font-size: 23px;
            }

            .h2-1 {
                font-size: 20px;
            }
        }

        /* 電腦大小 */
        @media (min-width: 768px) {
            body {
                background-image: url('./media/vendor_icons/BG_4.png');
            }

            .back-button {
                position: fixed;
                top: 10px;
                left: 10px;
                width: 100px;
                height: 100px;
                background-image: url('./media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png');
            }
            .container {
                padding: 20px;
            }
            h1,
            h2 {
                text-align: center;
                color: #333;
            }

            .h1-1 {
                font-size: 23px;
            }

            .h2-1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <button class="back-button" onclick="window.location.href='story.html'"></button>
    <!-- 重新挑戰按鈕 -->
    <style>
        .retry-btn-box {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .retry-btn {
            width: 100px;
            height: 40px;
            background: linear-gradient(135deg, #fffbe6 60%, #ffe0b2 100%);
            border: 2px solid #ffb74d;
            border-radius: 20px;
            color: #ff9800;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.18);
            cursor: pointer;
            transition: box-shadow 0.18s, background 0.18s, transform 0.18s, color 0.18s, border 0.18s;
            font-family: inherit;
            letter-spacing: 1px;
            outline: none;
        }
        .retry-btn:hover {
            background: linear-gradient(135deg, #ffd180 80%, #fffbe6 100%);
            box-shadow: 0 6px 18px rgba(255, 193, 7, 0.32);
            color: #e65100;
            border-color: #ffa726;
            transform: translateY(-2px) scale(1.06);
        }
        .retry-btn:active {
            background: #ffe0b2;
            box-shadow: 0 1px 2px rgba(255, 193, 7, 0.12);
            color: #ff9800;
            transform: scale(0.97);
        }
        .retry-btn:focus {
            box-shadow: 0 0 0 3px #ffe0b2, 0 2px 8px rgba(255, 193, 7, 0.18);
            border-color: #ff9800;
        }
    </style>
    <div class="retry-btn-box">
        <button class="retry-btn" aria-label="重新挑戰" id="retryBtn">重新挑戰</button>
    </div>
    <div class="container">
        <div class="test">
            <h1 class="h1-1" id="marketTitle">市集尋寶卡</h1>
            <h2 class="h2-1">請找到圖片中的寶物並回答問題</h2>
        </div>
        <div class="content">
           
        </div>
    </div>
    <script>
    // 取得所選市集（route1_market）
    var market = localStorage.getItem('route1_market') || '市集';
    document.getElementById('marketTitle').textContent = market + '市集尋寶卡';

    // 顯示 localStorage 的 user_id 於 console，方便除錯
    const debugUserId = localStorage.getItem('user_id');
    console.log('[route1.html] localStorage user_id:', debugUserId);

    // 取得 cookie 的工具函式
    function getCookie(name) {
        var value = "; " + document.cookie;
        var parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return "";
    }

    // 重新挑戰按鈕功能（改用 cookie phone）
    document.getElementById('retryBtn').addEventListener('click', function() {
        // 取得 cookie phone，作為帳號依據
        const phone = getCookie('phone');
        console.log('[重新挑戰] 取得 phone(cookie):', phone);
        if (!phone) {
            alert('請先登入！');
            console.log('[重新挑戰] 未取得 phone(cookie)，請先登入！');
            return;
        }
        // 呼叫 API，僅傳入 phone，後端依 phone 重置所有題目狀態
        // 取得市集與題號列表
        var market = localStorage.getItem('route1_market') || '';
        var levels = [];
        if (market) {
            try {
                levels = JSON.parse(localStorage.getItem('route1_questions_' + market)).map(q => q.number);
            } catch { levels = []; }
        }
        console.log('[重新挑戰] API 呼叫:', apiBaseUrl + 'init-content2/', { phone, market, levels });
        fetch(apiBaseUrl + 'init-content2/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ phone: phone, market: market, levels: levels })
        })
        .then(res => {
            console.log('[重新挑戰] API response status:', res.status);
            return res.json();
        })
        .then(data => {
            console.log('[重新挑戰] API response data:', data);
            // 回傳 { content2: ... }，直接刷新 UI
            if (data.content2) {
                resetProgressUI(data.content2);
                // 強制刷新頁面，確保 UI 狀態同步
                setTimeout(function() { location.reload(); }, 300);
            } else {
                alert('重置失敗，請稍後再試');
                console.warn('[重新挑戰] API response 無 content2:', data);
            }
        })
        .catch((err) => {
            alert('重置失敗，請檢查網路或稍後再試');
            console.error('[重新挑戰] API error:', err);
            console.log('[重新挑戰] debug info:', {
                phone,
                api: '/api/reset_treasure_progress',
                error: err
            });
        });
    });

    // 你需要根據實際 UI 實作這個函式
    function resetProgressUI(content2) {
        // 解析 content2 並刷新所有題目狀態
        // 例如：清空所有作答、分數、提示等
        // 這裡僅為範例，請根據你的資料結構調整
        // ...
        console.log('重置後資料', content2);
        // TODO: 實際刷新 UI
    }
    </script>
</body>

</html>
