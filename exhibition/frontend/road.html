<html lang="en">

<head>

    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AR遊戲集點</title>
        <style>
            .back-button {
                padding-top: -10px;
                position: fixed;
                top: 10px;
                left: 10px;
                width: 100px;
                height: 100px;
                background-image: url('img/back.png');
                background-size: cover;
                background-color: transparent;
                border: none;
                cursor: pointer;
                z-index: 1000;
            }

            h1 {
                margin-top: -25px;
                font-size: 20px;
            }

            h2 {
                font-size: 18px;
            }

            /* 手機大小 */
            @media (min-width: 320px) and (max-width: 480px) {
                body{
                    background-image: url('./media/vendor_icons/%E8%88%9E%E7%B4%85.png');
                }

                .back-button {
                    padding-top: -10px;
                    position: fixed;
                    top: 10px;
                    left: 10px;
                    width: 100px;
                    height: 100px;
                    background-image: url('./media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png');
                    background-size: cover;
                    background-color: transparent;
                    border: none;
                    cursor: pointer;
                    z-index: 1000;
                }

                .container {
                    padding: 10px;
                }

                .content {
                    font-size: 14px;
                }

                h1 {
                    margin-top: -25px;
                    font-size: 22px;
                }

                h2 {
                    font-size: 20px;
                }
            }

            /* 平板大小 */
            @media (min-width: 481px) and (max-width: 767px) {
                body{
                    background-image: url('./media/vendor_icons/%E8%88%9E%E7%B4%85.png');
                }

                .back-button {
                    padding-top: -10px;
                    position: fixed;
                    top: 10px;
                    left: 10px;
                    width: 100px;
                    height: 100px;
                    background-image: url('./media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png');
                    background-size: cover;
                    background-color: transparent;
                    border: none;
                    cursor: pointer;
                    z-index: 1000;
                }

                .container {
                    padding: 15px;
                }

                .content {
                    font-size: 16px;
                }

                h1 {
                    margin-top: -25px;
                    font-size: 22px;
                }

                h2 {
                    font-size: 20px;
                }
            }

            /* 電腦大小 */
            @media (min-width: 768px) {
                body{
                    background-image: url('./media/vendor_icons/%E8%88%9E%E7%B4%85.png');
                }

                .back-button {
                    padding-top: -10px;
                    position: fixed;
                    top: 10px;
                    left: 10px;
                    width: 100px;
                    height: 100px;
                    background-image: url('./media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png');
                    background-size: cover;
                    background-color: transparent;
                    border: none;
                    cursor: pointer;
                    z-index: 1000;
                }

                .container {
                    padding: 20px;
                }

                .content {
                    font-size: 18px;
                }

                h1 {
                    margin-top: -25px;
                    font-size: 22px;
                }

                h2 {
                    font-size: 20px;
                }

            }
        </style>
    </head>

<body>
    <button class="back-button" onclick="window.history.back()"></button>
    <div class="container">
        <div class="content">
            <h1>請選擇你所在的市集</h1>
            <div class="btr">

            <!-- 市集清單將由 JS 動態生成 -->
            <div id="marketBlock" style="display:none;">
                <form id="marketForm">
                    <div id="marketRadios" style="text-align:left; margin-left:0; padding-left:0;"></div>
                    <button type="submit" id="marketSubmit" style="margin-top:20px;">送出</button>
                </form>
                <div id="marketResult" style="margin-top:20px;color:green;"></div>
            </div>
            <script>
            // 控制市集選擇區塊是否顯示
            var marketEnabled = false; // true: 顯示市集選擇, false: 隱藏

            function updateMarketBlock() {
                document.getElementById('marketBlock').style.display = marketEnabled ? '' : 'none';
            }

            // 可在此切換 marketEnabled 狀態
            // marketEnabled = true; // 若要開啟市集選擇，將此行設為 true
            updateMarketBlock();

            // 動態載入市集清單並生成單選 radio
            document.addEventListener('DOMContentLoaded', function() {
                // 若要自動開啟市集選擇，請將 marketEnabled 設為 true
                // marketEnabled = true;
                updateMarketBlock();
                if (!marketEnabled) return;
                fetch('/api/markets/')
                    .then(res => res.json())
                    .then(data => {
                        const radiosDiv = document.getElementById('marketRadios');
                        radiosDiv.innerHTML = '';
                        if (Array.isArray(data.markets) && data.markets.length > 0) {
                            data.markets.forEach((market, idx) => {
                                const label = document.createElement('label');
                                label.style.display = 'block';
                                label.style.marginBottom = '8px';
                                const radio = document.createElement('input');
                                radio.type = 'radio';
                                radio.name = 'market';
                                radio.value = market;
                                if (idx === 0) radio.checked = true;
                                label.appendChild(radio);
                                label.appendChild(document.createTextNode(' ' + market));
                                radiosDiv.appendChild(label);
                            });
                        } else {
                            radiosDiv.innerHTML = '<span style="color:red">目前無市集可選擇</span>';
                            document.getElementById('marketSubmit').disabled = true;
                        }
                    })
                    .catch(() => {
                        document.getElementById('marketRadios').innerHTML = '<span style="color:red">載入市集失敗</span>';
                        document.getElementById('marketSubmit').disabled = true;
                    });

                // 表單送出事件
                document.getElementById('marketForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const selected = document.querySelector('input[name="market"]:checked');
                    if (selected) {
                        document.getElementById('marketResult').textContent = '已選擇市集：' + selected.value;
                        // TODO: 可在此加入後續跳轉或 API 送出邏輯
                    }
                });
            });
            </script>
        </div>
    </div>
</body>

</html>
