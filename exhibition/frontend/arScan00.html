<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/link.js"></script>
    <title>AR Game</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        /* 權限請求遮罩 */
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }

        #permission-overlay.hidden {
            display: none;
        }

        .permission-content {
            text-align: center;
            color: white;
            max-width: 400px;
        }

        .permission-content h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .permission-content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .start-ar-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-ar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .start-ar-btn:active {
            transform: translateY(0);
        }

        .start-ar-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .error-message h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .error-message p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 載入動畫 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background-image: url('./media/vendor_icons/Back.png');
            background-size: cover;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        /* 隱藏 AR 場景直到權限獲得 */
        a-scene {
            opacity: 0;
            transition: opacity 0.5s;
        }

        a-scene.ready {
            opacity: 1;
        }

        .center-box {
              position: fixed;
              top: 0%;
              left: 0%;
              width: 100vw;
              height: 100vh;           
              max-width: 100vw;           
              max-height: 100vh;
              background-color: white;
              background-image: url('media/vendor_icons/BG_2.png');
              background-size: cover;
              background-position: center;
              border-radius: 0px;
              box-sizing: border-box;
              display: none;
              padding: 5vh 5vw;
              text-align: center;
              overflow-y: auto;
              justify-content: center;
              align-items: center;
        }
        .intro-text {
            color: #FFF7E0;
        }
        
        .question {

            margin-bottom: 20px;
            margin-top: 20vh;
            font-size: 22px;
            font-weight: bold;
            text-align:left;
            color: #FFF7E0;
        }

        .option {
            display: block;
            margin-top: 10px;
            padding: 10px;
            font-size: 20px;
            cursor: pointer;
            background-color: #FFF7E0;
            border-radius: 5px;
            color: #2d741c;
            font-weight: bold;
            align-self:center;
        }
        
        .option:first-of-type {
             margin-top: 10vh;
        }

        .result {
            display: none;
            font-size: 18px;
        }

        .result img {
            max-width: 100%;
            height: auto;
        }

        .continue-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #FFF7E0;
            color: #2d741c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 22px;
        }

        /* 掃描提示樣式（已註解）
        .scanning-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            z-index: 999;
            max-width: 80%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: none; 預設隱藏 
        }*/

        .scanning-hint h3 {
            margin: 0 0 10px 0;
            color: #FFD700;
        }

        .scanning-hint p {
            margin: 5px 0;
            line-height: 1.4;
        }
        */
    </style>
</head>
<body>
    <!-- 權限請求遮罩 -->
    <div id="permission-overlay">
        <div class="permission-content">
            <h2>🎯 AR 體驗</h2>
            <p>此體驗需要使用您的裝置感應器來提供沉浸式 AR 功能。</p>
            <button class="start-ar-btn" id="start-ar-btn" onclick="requestDevicePermission()">
                啟動 AR 相機
            </button>
            <div class="error-message" id="error-message">
                <h3>⚠️ 權限被拒絕</h3>
                <p>請在「設定 > Safari > 動作與方向」中允許存取，然後點擊下方按鈕重試。</p>
            </div>
        </div>
    </div>
        <button class="back-button" onclick="goBack()"></button>
    <h1></h1>
    <a-scene mindar-image="imageTargetSrc: ./mind/targets_03.mind; uiScanning: no; uiLoading: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- 換圖片 -->
            <img id="card1" src="img/img_01.png" />
            <img id="card2" src="img/img_02.png" />
            <img id="card3" src="img/img_03.png" />
            <img id="card4" src="img/img_04.png" />
            <img id="card5" src="img/img_05.png" />
            <img id="card6" src="img/img_06.png" />

            


            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 設定多個 mindar-image-target 元素，每個對應一個 targetIndex -->
        <a-entity mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity mindar-image-target="targetIndex: 5"></a-entity>



    </a-scene>

        <!-- 自訂掃描框動畫區塊 -->
        <div id="custom-scan-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;">
            <div id="scan-box-area" style="position: relative; background: rgba(0,0,0,0.2); border-radius: 32px; width: calc(100vw - 20px); height: calc(100vw - 20px); max-width: calc(100vh - 20px); max-height: calc(100vh - 20px); margin: 0 auto;">
                <!-- 四角角標 -->
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <!-- 掃描線 -->
                <div class="scanline"></div>
            </div>
            <div style="margin-top: 18px; color: #FFD700; font-size: 1.2em; font-weight: bold; text-align: center; width: 100vw;">請將相機對準指定圖片</div>
        </div>
            <style>
                    .corner {
                        position: absolute; width: 48px; height: 48px; border: 6px solid #FFD700; border-radius: 12px;
                    }
                .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
                .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
                .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
                .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
                    .scanline {
                        position: absolute; left: 24px; right: 24px; height: 5px; background: linear-gradient(90deg,#FFD700 60%,rgba(255,255,255,0.2) 100%);
                        border-radius: 3px; animation: scanMove 1.2s infinite linear alternate;
                    }
                    @keyframes scanMove {
                        0% { top: 48px; }
                        100% { top: calc(100% - 72px); }
                    }
                    @media (max-width: 600px) {
                        #scan-box-area {
                            width: calc(100vw - 20px) !important;
                            height: calc(100vw - 20px) !important;
                            max-width: calc(100vh - 20px) !important;
                            max-height: calc(100vh - 20px) !important;
                        }
                    }
            </style>

    <div class="center-box">
        <div class="status-message"></div>
        <button class="continue-btn" onclick="window.history.back()">繼續前行</button>
    </div>
    <!-- loading 狀態 -->
    <div id="loading-box" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:15px;padding:32px 24px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:2000;text-align:center;min-width:180px;">
        <div style="font-size:1.3em;font-weight:600;margin-bottom:12px;">題目載入中...</div>
        <div class="loader" style="margin:0 auto;width:40px;height:40px;border:5px solid #eee;border-top:5px solid #4F74AB;border-radius:50%;animation:spin 1s linear infinite;"></div>
    </div>
    <style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>

    <script>
        // iOS 權限請求處理
        let permissionGranted = false;

        async function requestDevicePermission() {
            const startBtn = document.getElementById('start-ar-btn');
            const errorMsg = document.getElementById('error-message');
            const overlay = document.getElementById('permission-overlay');
            
            // 顯示載入狀態
            startBtn.innerHTML = '請求權限中...<span class="spinner"></span>';
            startBtn.disabled = true;
            errorMsg.classList.remove('show');

            try {
                // 檢查是否為 iOS 13+ 需要權限
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    // iOS 13+ 需要明確請求權限
                    const motionPermission = await DeviceMotionEvent.requestPermission();
                    const orientationPermission = typeof DeviceOrientationEvent.requestPermission === 'function' 
                        ? await DeviceOrientationEvent.requestPermission()
                        : 'granted';

                    if (motionPermission === 'granted' && orientationPermission === 'granted') {
                        permissionGranted = true;
                        console.log('✅ 裝置感應器權限已獲得');
                        startARExperience();
                    } else {
                        throw new Error('權限被拒絕');
                    }
                } else {
                    // 非 iOS 或舊版本，直接啟動
                    permissionGranted = true;
                    console.log('✅ 不需要權限請求，直接啟動');
                    startARExperience();
                }
            } catch (error) {
                console.error('❌ 權限請求失敗:', error);
                // 顯示錯誤訊息和重試按鈕
                startBtn.innerHTML = '重試';
                startBtn.disabled = false;
                errorMsg.classList.add('show');
            }
        }

        function startARExperience() {
            const overlay = document.getElementById('permission-overlay');
            const scene = document.querySelector('a-scene');
            
            // 隱藏權限遮罩
            overlay.classList.add('hidden');
            
            // 顯示 AR 場景
            if (scene) {
                scene.classList.add('ready');
            }
            
            console.log('🎯 AR 體驗已啟動');
        }

        // 全域變數
        let scanningHintTimeout;
        
        // 隱藏掃描提示（全域函數）
        function hideScanningHint() {
            if (scanningHintTimeout) {
                clearTimeout(scanningHintTimeout);
            }
            $('#scanning-hint').fadeOut(300);
        }
        
        // 函數：獲取指定名稱的 cookie 值
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        $(document).ready(function () {
            // 顯示 MIND 檔案路徑 LOG
            const mindPath = $('a-scene').attr('mindar-image').match(/imageTargetSrc:\s*([^;]+)/);
            let selectedLevel = localStorage.getItem('route1_selected_level');
            let mindIndex = selectedLevel ? (parseInt(selectedLevel) - 1) : null;
            let scanImageName = '';
            // 取得需掃描的正確圖案名稱（假設 img id 與題號對應）
            if (selectedLevel) {
                let imgEl = document.getElementById('card' + selectedLevel);
                if (imgEl) {
                    scanImageName = imgEl.getAttribute('src');
                }
            }
            if (mindPath && mindPath[1]) {
                const link = document.createElement('a');
                link.href = mindPath[1];
                const absoluteUrl = link.href;
                console.log('[MIND 檔案路徑]', absoluteUrl);
            } else {
                console.log('[MIND 檔案路徑] 未偵測到');
            }
            console.log('[題號 selectedLevel]', selectedLevel);
            console.log('[MIND INDEX]', mindIndex);
            console.log('[需掃描的正確圖案]', scanImageName);
            // 額外印出所有 (i + 1) 與 selectedLevel 比對
            for (let i = 0; i <= 5; i++) {
                console.log(`[targetIndex ${i}] (i+1): ${i+1}, selectedLevel: ${selectedLevel}`);
            }

            // 頁面載入時顯示自訂掃描框動畫
            document.getElementById('custom-scan-box').style.display = 'flex';
            let targetFoundOnce = false;
            let phone = getCookie('phone');

            // 顯示掃描提示（延遲3秒後顯示）
            function showScanningHint() {
                console.log('Starting scanning hint timer...');
                scanningHintTimeout = setTimeout(function() {
                    console.log('Showing scanning hint, targetFoundOnce:', targetFoundOnce);
                    if (!targetFoundOnce) {
                        console.log('Displaying scanning hint');
                        $('#scanning-hint').fadeIn(500);
                    }
                }, 3000); // 3秒後顯示提示
            }

            // 立即開始計時器（頁面載入後）
            console.log('Document ready, starting hint timer immediately');
            showScanningHint();

            // 同時監聽 A-Frame scene 事件（備用）
            $(document).on('DOMContentLoaded', function() {
                console.log('DOMContentLoaded triggered');
                if (!scanningHintTimeout) {
                    showScanningHint();
                }
            });

            // 監聽每個 targetIndex 的事件
            // 只允許掃描到 route1_selected_level 對應的 targetIndex 時才顯示題目
            for (let i = 0; i <= 5; i++) {
                let mindarEntity = document.querySelector(`a-entity[mindar-image-target="targetIndex: ${i}"]`);
                mindarEntity.addEventListener('targetFound', function (event) {
                    // 僅當掃描到正確題號才顯示說明頁
                    if (String(i + 1) !== selectedLevel) {
                        // 可選：顯示提示
                        $('.status-message').html('<h3 style="font-size:1.2em;font-weight:600;margin-bottom:10px;">請掃描正確的圖卡！</h3>');
                        $('.continue-btn').hide();
                        $('.center-box').css({minHeight:'120px',height:'auto'}).fadeIn();
                        setTimeout(function(){ $('.center-box').fadeOut(); }, 1200);
                        return;
                    }
                    if (!targetFoundOnce) {
                        targetFoundOnce = true;
                        // 掃描到正確 target 時隱藏自訂掃描框動畫
                        document.getElementById('custom-scan-box').style.display = 'none';
                        hideScanningHint();
                        console.log('Target found! Level:', i + 1);
                        let level = String(i + 1);
                        // 根據題號顯示不同說明
                        const introMap = {
                            '1': '第一關｜山林之源：霧中孕育的茶香<br><br>六龜位於高雄山區，四面環山、雲霧繚繞。早晨的霧氣為茶樹帶來天然保濕，也讓茶湯散發清新的花香。當地茶農稱這裡的「霧氣」是最好的老師，教會茶樹慢慢生長，慢慢釋放香氣。',
                            '2': '第二關｜手工摘採：一心二葉的堅持<br><br>六龜的茶農延續傳統採摘方式，只取「一心二葉」——也就是最嫩的茶芽與兩片新葉。這樣做不但能確保茶香純淨，也體現對品質的堅持。每一籃茶葉都凝聚了農人清晨的汗水與眼光。',
                            '3': '第三關｜火候的藝術：製茶師的手感<br><br>烘培茶葉是決定香氣的靈魂。六龜的製茶師不用溫度計，全靠「手感」判斷茶葉的乾濕與香氣變化。他們說：「茶會告訴你它準備好了。」這份技藝，是時間和經驗累積的智慧。',
                            '4': '第四關｜茶與器的對話：映出山色的壺<br><br>你來到山腰的一處茶室，窗外雲霧繚繞。茶師正以不同的壺具沖泡同樣的山茶，香氣卻各異。她微笑著說：「懂茶的人，不只懂葉，也懂壺。',
                            '5': '第五關｜金湯觀色：茶湯的顏色語言<br><br>你端起茶杯，茶湯如金、如琥珀。老人問：「看顏色，就知道茶的性情。」綠茶湯色淡黃清亮；烏龍茶呈金黃或蜜綠；紅茶則是紅褐色。六龜的山茶屬輕發酵茶，湯色明亮、帶花果香。',
                            '6': '第六關｜山林記憶：手炒茶的時光香氣<br><br>手炒茶的時光香氣你拾階而上，來到古老的製茶小屋。屋內傳來陣陣茶香，一位婦人正用雙手翻炒茶葉。火光映照她的臉龐，她說：「每一片茶葉，都有祖先留下的手感。'
                        };
                        let introText = introMap[level] || '本關卡說明：請仔細閱讀規則與提示，點擊「下一頁」開始答題。';
                            $('.center-box').html(`
                                <div class="intro-text" style="font-size:1.1em;margin-bottom:18px; margin-top:150px;">${introText}</div>
                                <button class="continue-btn" id="nextToQuestion" style="margin-top:50px;">下一頁</button>
                            `);
                        $('.center-box').show();
                        // 點下一頁才顯示問答區塊
                        $('#nextToQuestion').off('click').on('click', function() {
                            $('.center-box').hide();
                            $('.status-message').html('');
                            $('.continue-btn').hide();
                            $('.center-box').find('h3, div').remove();
                            // 顯示 loading 狀態
                            $('#loading-box').fadeIn();
                            $.ajax({
                                url: postDetailUrl + phone,
                                type: "GET",
                                dataType: "json",
                                success: function (data) {
                                    let status = data.content[level].status;
                                    if (status === 'pass' || status === 'fail') {
                                        $('.status-message').html('<h3>你已做出選擇，請繼續前行吧</h3>');
                                        $('.continue-btn').show();
                                        $('#loading-box').hide();
                                        $('.center-box').fadeIn();
                                    } else {
                                        // 顯示題目
                                        $.ajax({
                                            url: questionUrl + level,
                                            type: "GET",
                                            dataType: "json",
                                            success: function (Question) {
                                                $('#loading-box').hide();
                                                var correctAnswer = Question.answer;
                                                var content = `
                                                    <div class="question">${Question.question}</div>
                                                    <button class="option" data-choice="A">${Question.choiceA}</button>
                                                    <button class="option" data-choice="B">${Question.choiceB}</button>
                                                    <button class="option" data-choice="C">${Question.choiceC}</button>
                                                    <button class="option" data-choice="D">${Question.choiceD}</button>
                                                    <div class="result"></div>
                                                `;
                                                $('.center-box').html(content);
                                                $('.continue-btn').show();
                                                $('.center-box').fadeIn();
                                                $('.option').click(function () {
                                                    var userChoice = $(this).data('choice');
                                                    var resultStatus = userChoice === correctAnswer ? 'pass' : 'fail';
                                                    $('.question, .option').remove();
                                                    if (resultStatus === 'pass') {
                                                        $('.result').html('<p>恭喜通關</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/correct.png?raw=true" alt="Success Image"><button class="continue-btn" onclick="window.location.href=\'route1.html\'">繼續前行</button>');
                                                    } else {
                                                        $('.result').html('<p>挑戰失敗</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/wrong.png?raw=true" alt="Failure Image"><button class="continue-btn" onclick="window.location.href=\'route1.html\'">繼續前行</button>');
                                                    }
                                                    $('.result').fadeIn();
                                                    $.ajax({
                                                        url: `${postUrl}${phone}/`,
                                                        type: "PATCH",
                                                        contentType: "application/json",
                                                        data: JSON.stringify({
                                                            level: level,
                                                            status: resultStatus,
                                                            user_answer: userChoice,
                                                            correct_answer: correctAnswer,
                                                            market: localStorage.getItem('route1_market') || '市集'
                                                        }),
                                                        success: function (response) {
                                                            console.log("數據更新成功:", response);
                                                            // 答題成功自動跳轉回 route1.html，進度自動刷新
                                                            setTimeout(function() {
                                                                window.location.href = 'route1.html';
                                                            }, 800); // 0.8秒後跳轉，讓動畫顯示
                                                        },
                                                        error: function (xhr, status, error) {
                                                            console.error("更新失敗:", xhr.responseText);
                                                        }
                                                    });
                                                });
                                            },
                                            error: function (xhr, status, error) {
                                                $('#loading-box').hide();
                                                console.error("獲取問題失敗:", xhr.responseText);
                                            }
                                        });
                                    }
                                },
                                error: function (xhr, status, error) {
                                    $('#loading-box').hide();
                                    console.error("獲取數據失敗:", xhr.responseText);
                                }
                            });
                        });
                    }
                });
            }
        });

        // 返回函數
        function goBack() {
            console.log('返回按鈕被點擊');
            window.history.back();
        }
    </script>
</body>
</html>
