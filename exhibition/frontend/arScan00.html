<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/link.js"></script>
    <title>AR Game</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background-image: url('https://github.com/tdance555/tdance2024/blob/main/media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png?raw=true');
            background-size: cover;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .center-box {
              position: fixed;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              min-width: 280px;
              max-width: 90vw;
              min-height: 120px;
              max-height: 80vh;
              background-color: white;
              border-radius: 15px;
              box-sizing: border-box;
              display: none;
              padding: 24px 18px;
              text-align: center;
              overflow-y: auto;
        }

        .question {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align:left;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            font-size: 22px;
            cursor: pointer;
            background-color: #4F74AB;
            border-radius: 5px;
            color: white;
            align-self:center;
        }

        .result {
            display: none;
            font-size: 18px;
        }

        .result img {
            max-width: 100%;
            height: auto;
        }

        .continue-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4F74AB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 22px;
        }

        /* 掃描提示樣式（已註解）
        .scanning-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            z-index: 999;
            max-width: 80%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: none; 預設隱藏 
        }*/

        .scanning-hint h3 {
            margin: 0 0 10px 0;
            color: #FFD700;
        }

        .scanning-hint p {
            margin: 5px 0;
            line-height: 1.4;
        }
        */
    </style>
</head>
<body>
        <button class="back-button" onclick="goBack()"></button>
    <h1></h1>

            <img id="card26" src="img/img_26.png" />
            <img id="card27" src="img/img_27.png" />

            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>

        <!-- 自訂掃描框動畫區塊 -->
        <div id="custom-scan-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999;">
            <div id="scan-box-area" style="position: relative; background: rgba(0,0,0,0.2); border-radius: 32px; width: calc(100vw - 20px); height: calc(100vw - 20px); max-width: calc(100vh - 20px); max-height: calc(100vh - 20px); margin: 0 auto;">
                <!-- 四角角標 -->
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <!-- 掃描線 -->
                <div class="scanline"></div>
            </div>
            <div style="margin-top: 18px; color: #FFD700; font-size: 1.2em; font-weight: bold; text-align: center; width: 100vw;">請將相機對準指定圖片</div>
        </div>
            <style>
                    .corner {
                        position: absolute; width: 48px; height: 48px; border: 6px solid #FFD700; border-radius: 12px;
                    }
                .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
                .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
                .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
                .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }
                    .scanline {
                        position: absolute; left: 24px; right: 24px; height: 5px; background: linear-gradient(90deg,#FFD700 60%,rgba(255,255,255,0.2) 100%);
                        border-radius: 3px; animation: scanMove 1.2s infinite linear alternate;
                    }
                    @keyframes scanMove {
                        0% { top: 48px; }
                        100% { top: calc(100% - 72px); }
                    }
                    @media (max-width: 600px) {
                        #scan-box-area {
                            width: calc(100vw - 20px) !important;
                            height: calc(100vw - 20px) !important;
                            max-width: calc(100vh - 20px) !important;
                            max-height: calc(100vh - 20px) !important;
                        }
                    }
            </style>

    <div class="center-box">
        <div class="status-message"></div>
        <button class="continue-btn" onclick="window.history.back()">繼續前行</button>
    </div>
    <!-- loading 狀態 -->
    <div id="loading-box" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:15px;padding:32px 24px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:2000;text-align:center;min-width:180px;">
        <div style="font-size:1.3em;font-weight:600;margin-bottom:12px;">題目載入中...</div>
        <div class="loader" style="margin:0 auto;width:40px;height:40px;border:5px solid #eee;border-top:5px solid #4F74AB;border-radius:50%;animation:spin 1s linear infinite;"></div>
    </div>
    <style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>

    <script>
        // 全域變數
        let scanningHintTimeout;
        
        // 隱藏掃描提示（全域函數）
        function hideScanningHint() {
            if (scanningHintTimeout) {
                clearTimeout(scanningHintTimeout);
            }
            $('#scanning-hint').fadeOut(300);
        }
        
        // 函數：獲取指定名稱的 cookie 值
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        $(document).ready(function () {
            // 頁面載入時顯示自訂掃描框動畫
            document.getElementById('custom-scan-box').style.display = 'flex';
            let targetFoundOnce = false;
            let phone = getCookie('phone');
            
            // 顯示掃描提示（延遲3秒後顯示）
            function showScanningHint() {
                console.log('Starting scanning hint timer...');
                scanningHintTimeout = setTimeout(function() {
                    console.log('Showing scanning hint, targetFoundOnce:', targetFoundOnce);
                    if (!targetFoundOnce) {
                        console.log('Displaying scanning hint');
                        $('#scanning-hint').fadeIn(500);
                    }
                }, 3000); // 3秒後顯示提示
            }
            
            // 立即開始計時器（頁面載入後）
            console.log('Document ready, starting hint timer immediately');
            showScanningHint();
            
            // 同時監聽 A-Frame scene 事件（備用）
            $(document).on('DOMContentLoaded', function() {
                console.log('DOMContentLoaded triggered');
                if (!scanningHintTimeout) {
                    showScanningHint();
                }
            });

            // 監聽每個 targetIndex 的事件
            // 只允許掃描到 route1_selected_level 對應的 targetIndex 時才顯示題目
            let selectedLevel = localStorage.getItem('route1_selected_level');
            for (let i = 0; i <= 28; i++) {
                let mindarEntity = document.querySelector(`a-entity[mindar-image-target="targetIndex: ${i}"]`);
                mindarEntity.addEventListener('targetFound', function (event) {
                    // 僅當掃描到正確題號才顯示題目
                    if (String(i + 1) !== selectedLevel) {
                        // 可選：顯示提示
                            $('.status-message').html('<h3 style="font-size:1.2em;font-weight:600;margin-bottom:10px;">請掃描正確的圖卡！</h3>');
                            $('.continue-btn').hide();
                            $('.center-box').css({minHeight:'120px',height:'auto'}).fadeIn();
                            setTimeout(function(){ $('.center-box').fadeOut(); }, 1200);
                            return;
                    }
                    if (!targetFoundOnce) {
                        targetFoundOnce = true;
                        // 掃描到正確 target 時隱藏自訂掃描框動畫
                        document.getElementById('custom-scan-box').style.display = 'none';
                        hideScanningHint();
                        console.log('Target found! Level:', i + 1);
                        let level = String(i + 1);
                        // 直接顯示題目
                            $('.center-box').hide();
                            $('.status-message').html('');
                            $('.continue-btn').hide();
                            $('.center-box').find('h3, div').remove();
                            // 直接獲取關卡狀態
                                // 顯示 loading 狀態
                                $('#loading-box').fadeIn();
                        $.ajax({
                                url: postDetailUrl + phone,
                                type: "GET",
                                dataType: "json",
                                success: function (data) {
                                    let status = data.content[level].status;
                                    if (status === 'pass' || status === 'fail') {
                                            $('.status-message').html('<h3>你已做出選擇，請繼續前行吧</h3>');
                                            $('.continue-btn').show();
                                                $('#loading-box').hide();
                                            $('.center-box').fadeIn();
                                    } else {
                                        // 顯示題目
                                        $.ajax({
                                            url: questionUrl + level,
                                            type: "GET",
                                            dataType: "json",
                                            success: function (Question) {
                                                        $('#loading-box').hide();
                                                var correctAnswer = Question.answer;
                                                var content = `
                                                    <div class="question">${Question.question}</div>
                                                    <button class="option" data-choice="A">${Question.choiceA}</button>
                                                    <button class="option" data-choice="B">${Question.choiceB}</button>
                                                    <button class="option" data-choice="C">${Question.choiceC}</button>
                                                    <button class="option" data-choice="D">${Question.choiceD}</button>
                                                    <div class="result"></div>
                                                `;
                                                    $('.center-box').html(content);
                                                    $('.continue-btn').show();
                                                    $('.center-box').fadeIn();
                                                $('.option').click(function () {
                                                    var userChoice = $(this).data('choice');
                                                    var resultStatus = userChoice === correctAnswer ? 'pass' : 'fail';
                                                    $('.question, .option').remove();
                                                    if (resultStatus === 'pass') {
                                                        $('.result').html('<p>恭喜通關</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/correct.png?raw=true" alt="Success Image"><button class="continue-btn" onclick="window.location.href=\'route1.html\'">繼續前行</button>');
                                                    } else {
                                                        $('.result').html('<p>挑戰失敗</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/wrong.png?raw=true" alt="Failure Image"><button class="continue-btn" onclick="window.location.href=\'route1.html\'">繼續前行</button>');
                                                    }
                                                    $('.result').fadeIn();
                                                    $.ajax({
                                                        url: `${postUrl}${phone}/`,
                                                        type: "PATCH",
                                                        contentType: "application/json",
                                                        data: JSON.stringify({
                                                            level: level,
                                                            status: resultStatus,
                                                            user_answer: userChoice,
                                                            correct_answer: correctAnswer,
                                                            market: localStorage.getItem('route1_market') || '市集'
                                                        }),
                                                        success: function (response) {
                                                            console.log("數據更新成功:", response);
                                                            // 答題成功自動跳轉回 route1.html，進度自動刷新
                                                            setTimeout(function() {
                                                                window.location.href = 'route1.html';
                                                            }, 800); // 0.8秒後跳轉，讓動畫顯示
                                                        },
                                                        error: function (xhr, status, error) {
                                                            console.error("更新失敗:", xhr.responseText);
                                                        }
                                                    });
                                                });
                                            },
                                            error: function (xhr, status, error) {
                                                    $('#loading-box').hide();
                                                console.error("獲取問題失敗:", xhr.responseText);
                                            }
                                        });
                                    }
                                },
                                error: function (xhr, status, error) {
                                        $('#loading-box').hide();
                                    console.error("獲取數據失敗:", xhr.responseText);
                                }
                            });
                    }
                });
            }
        });

        // 返回函數
        function goBack() {
            console.log('返回按鈕被點擊');
            window.history.back();
        }
    </script>
