    <style>

            border-radius: 20px;
            padding: 10px;

            color: #2d741c;
            font-weight: bold;

        }

        .container {

            box-sizing: border-box;

            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .content {
            padding: 20px;
            border-radius: 5px;

            max-width: 375px;

            position: relative;

            background-color: #FFF7E0 !important;

            text-align: center;

            display: inline-block;
            font-size: 20px;
            border-radius: 50px;
            border: 5px solid  #4f6fab;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .buttonOther {
            background-color: rgb(255, 255, 255);
            color: white;
            padding: 20px 42px;
            text-align: center;
            text-decoration: auto;
            display: inline-block;
            font-size: 16px;
            border-radius: 10px;
            border: 5px solid  #4F74AB;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 50px;
            font-size: 20px;
        }

        h2 {
            font-size: 18px;
        }

        .h2Row2 {
            margin-top: -10px;
            margin-bottom: 55px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 10px;
            text-align: center;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        /* 備註:活動跟關於的彈窗圖片請到下方找:<!-- 彈窗1: 活動地圖 -->、<!-- 彈窗2: 本次活動 -->的連結直接修改 */

                color: rgb(0, 0, 0);
                padding: 20px 42px;
                text-align: center;

                display: inline-block;

                border-radius: 10px;

        @media (min-width: 481px) and (max-width: 767px) {
            body {
                background-image: url('./media/vendor_icons/BG_4.png');
            }
            .container {
                padding: 15px;
            }

            .content {
                font-size: 16px;
            }
            .buttonStart {
                background-color: #FFF7E0;
            color: #2d741c;
                padding: 20px 42px;
                text-align: center;
                text-decoration: auto;
                display: inline-block;
                font-size: 20px;
                border-radius: 50px;
                border: 5px solid  #4f6fab;
                font-weight: bold;

            }

        /* 電腦大小 */

<body>
    <div class="container">
        <div class="content">
            <h1>親愛的旅行者，歡迎你的加入</h1>
            <h2>請選擇您所在市集後，開啟尋寶卡</h2>
            <h2>開始你的尋寶之旅吧~</h2>
            <!-- 市集選擇區塊 -->
            <div id="marketBlock" style="display:none; margin-bottom:30px;">
                <h2 style="text-align:center; margin-bottom:16px;">請選擇你所在的市集</h2>
                <br>
                <form id="marketForm" style="display:flex; flex-direction:column; align-items:center;">
                    <select id="marketSelect" name="market" style="width:70%; font-size:18px; margin-bottom:18px; text-align:center;"></select>
                    <button type="button" id="marketSubmit" style="margin-top:10px; display:none;">送出</button>
                </form>
                <div id="marketResult" style="margin-top:20px;color:green; text-align:center;"></div>
            </div>
            <script>
// 取得 cookie 的工具函式
function getCookie(name) {
    var value = "; " + document.cookie;
    var parts = value.split("; " + name + "=");
    if (parts.length === 2) return parts.pop().split(";").shift();
    return "";
}
            // 控制市集選擇區塊是否顯示
            var marketEnabled = true; // true: 顯示市集選擇, false: 隱藏
            function updateMarketBlock() {
                document.getElementById('marketBlock').style.display = marketEnabled ? '' : 'none';
            }
            updateMarketBlock();
            document.addEventListener('DOMContentLoaded', function() {
                updateMarketBlock();
                if (!marketEnabled) return;
                fetch(marketListUrl)
                    .then(res => res.json())
                    .then(data => {
                        const select = document.getElementById('marketSelect');
                        select.innerHTML = '';
                        if (Array.isArray(data.markets) && data.markets.length > 0) {
                            data.markets.forEach((market, idx) => {
                                const option = document.createElement('option');
                                option.value = market;
                                option.textContent = market;
                                select.appendChild(option);
                            });
                            select.selectedIndex = 0;
                            document.getElementById('marketSubmit').disabled = false;
                        } else {
                            select.innerHTML = '<option disabled>目前無市集可選擇</option>';
                            document.getElementById('marketSubmit').disabled = true;
                        }
                    })
                    .catch(() => {
                        const select = document.getElementById('marketSelect');
                        select.innerHTML = '<option disabled>載入市集失敗</option>';
                        document.getElementById('marketSubmit').disabled = true;
                    });
                document.getElementById('marketForm').addEventListener('submit', function(e) {
                    
                });
            });
            </script>
            <button onclick="openTreasureGame()" class="buttonStart">開啟尋寶卡</button>
            <span id="teachBtnContainer"></span>
            <span id="mapBtnContainer"></span>
            <script>
            var showAboutBtn = false; // 控制「關於本次活動」按鈕顯示
            if (showAboutBtn) {
                document.write('<button onclick="openModal(\'aboutModal\')" class="buttonOther">關於本次活動</button>');
            }
            </script>
        </div>
    </div>

    <!-- 彈窗1: 活動地圖 -->
    <div id="mapModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('mapModal')">&times;</span>
            <img class="map" src="./media/vendor_icons/MAP_2.jpg" alt="活動地圖">
        </div>
    </div>

    <!-- 彈窗2: 本次活動 -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('aboutModal')">&times;</span>
            <img class="about" src="./media/vendor_icons/About.jpg" alt="關於本次活動">
        </div>
    </div>

    <script>
    // 跨裝置同步進度：進入 function.html 時自動查詢遠端進度，寫入 localStorage
    document.addEventListener('DOMContentLoaded', function() {
        var phone = getCookie('phone');
        var market = localStorage.getItem('route1_market');
        if (phone && market) {
            // 查詢該 phone、market 的進度
            fetch(apiBaseUrl + 'get-progress/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, market: market })
            })
            .then(res => res.json())
            .then(result => {
                // 預期 result.content2.data 為題目進度
                if (result && result.content2 && result.content2.data) {
                    var questionsArr = [];
                    Object.keys(result.content2.data).sort((a, b) => parseInt(a) - parseInt(b)).forEach(function(key) {
                        questionsArr.push({ number: key });
                    });
                    localStorage.setItem('route1_questions_' + market, JSON.stringify(questionsArr));
                }
            })
            .catch(err => {
                console.warn('[跨裝置同步] 查詢進度失敗', err);
            });
        }
    });

    function openTreasureGame() {
        // 取得市集選擇值
        var marketSelect = document.getElementById('marketSelect');
        var market = marketSelect ? marketSelect.value : null;
        var dateInput = document.getElementById('dateInput');
        var date = dateInput ? dateInput.value.trim() : '';
        if (!market) {
            alert('請先選擇市集');
            return;
        }
        console.log('[openTreasureGame] 市集:', market, '日期:', date);
        // 取得市集隨機6題（加上日期條件）
        var apiUrl = marketQuestionsUrl + '?market=' + encodeURIComponent(market);
        if (date) {
            apiUrl += '&date=' + encodeURIComponent(date);
        }
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                console.log('[openTreasureGame] 市集題目API回傳:', data);
                if (Array.isArray(data.questions) && data.questions.length > 0) {
                    var levels = data.questions.map(q => q.number);
                    var phone = getCookie('phone');
                    // 呼叫後端 API 初始化 content2
                    fetch(apiBaseUrl + 'init-content2/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ phone: phone, levels: levels, market: market })
                    })
                    .then(res => res.json())
                    .then(result => {
                        console.log('[openTreasureGame] 初始化content2 API回傳:', result);
                        // 依據後端回傳的 content2.data 產生題目
                        var content2 = result.content2;
                        var questionsArr = [];
                        if (content2 && content2.data) {
                            Object.keys(content2.data).sort((a, b) => parseInt(a) - parseInt(b)).forEach(function(key) {
                                questionsArr.push({ number: key });
                            });
                        }
                        localStorage.setItem('route1_questions_' + market, JSON.stringify(questionsArr));
                        localStorage.setItem('route1_market', market);
                        window.location.href = 'story.html';
                    })
                    .catch((err) => {
                        console.error('[openTreasureGame] 初始化content2 API失敗:', err);
                        alert('初始化進度失敗');
                        window.location.href = 'story.html';
                    });
                } else {
                    alert('此市集暫無題目');
                }
            })
            .catch((err) => {
                console.error('[openTreasureGame] 市集題目API失敗:', err);
                if (err && err instanceof Error) {
                    alert('載入市集題目失敗\n' + err.message);
                } else {
                    alert('載入市集題目失敗');
                }
            });
    }
        // 控制活動地圖按鈕是否顯示
        var controlMapBtn = false; // 設為 false 則不顯示
        if (controlMapBtn) {
            document.getElementById('mapBtnContainer').innerHTML = '<button onclick="openModal(\'mapModal\')" class="buttonOther">查詢活動地圖</button>';
        }
        function ToGamePage() {
            window.location.href =road;
        }

        function ToTeachPage() {
            window.location.href = manual;
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = "block";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function toTeach() {
            window.location.href = teach;
        }

        // 「如何遊玩遊戲」按鈕顯示
        var showTeachBtn = false; // 設為 false 則不顯示
        if (showTeachBtn) {
            document.getElementById('teachBtnContainer').innerHTML = '<button onclick="toTeach()" class="buttonOther">如何遊玩遊戲</button>';
        }
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
            }
        }
    </script>
</body>

</html>
