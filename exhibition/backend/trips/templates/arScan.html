<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Game - Level {{ level }}</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        /* 權限請求遮罩 */
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            box-sizing: border-box;
        }

        #permission-overlay.hidden {
            display: none;
        }

        .permission-content {
            text-align: center;
            color: white;
            max-width: 400px;
        }

        .permission-content h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .permission-content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .start-ar-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-ar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .start-ar-btn:active {
            transform: translateY(0);
        }

        .start-ar-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .error-message h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .error-message p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 載入動畫 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background-image: url('https://github.com/tdance555/tdance2024/blob/main/media/vendor_icons/%E5%B0%8D%E9%8C%AF%E8%BF%94%E5%9B%9E_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20%E8%A4%87%E6%9C%AC%204.png?raw=true');
            background-size: cover;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        /* 隱藏 AR 場景直到權限獲得 */
        a-scene {
            opacity: 0;
            transition: opacity 0.5s;
        }

        a-scene.ready {
            opacity: 1;
        }

        .center-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 15px;
            box-sizing: border-box;
            display: none;
            padding: 20px;
            text-align: center;
        }

        .question {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4F74AB;
            border-radius: 5px;
            color: white;
            align-self:center;
        }

        .result {
            display: none;
            font-size: 18px;
        }

        .result img {
            max-width: 100%;
            height: auto;
        }

        .continue-btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4F74AB;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 權限請求遮罩 -->
    <div id="permission-overlay">
        <div class="permission-content">
            <h2>🎯 AR 體驗</h2>
            <p>此體驗需要使用您的裝置感應器來提供沉浸式 AR 功能。</p>
            <button class="start-ar-btn" id="start-ar-btn" onclick="requestDevicePermission()">
                啟動 AR 相機
            </button>
            <div class="error-message" id="error-message">
                <h3>⚠️ 權限被拒絕</h3>
                <p>請在「設定 > Safari > 動作與方向」中允許存取，然後點擊下方按鈕重試。</p>
            </div>
        </div>
    </div>
    <button class="back-button" onclick="window.history.back()"></button>
    <h1></h1>
    <!-- 動態載入 mind 檔案 -->
    <a-scene mindar-image="imageTargetSrc: ../mind/targets_{{ level|stringformat:"02d" }}.mind; uiError: no; uiLoading: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- 動態載入圖片 -->
            <img id="card" src="https://github.com/tdance555/tdance2024/blob/beforeFinish/trips/img/img_{{ level|stringformat:"02d" }}.png?raw=true" />
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <div class="center-box">
        <div class="status-message"></div>
        <button class="continue-btn" onclick="window.history.back()">繼續前行</button>
    </div>

    <script>
        // iOS 權限請求處理
        let permissionGranted = false;

        async function requestDevicePermission() {
            const startBtn = document.getElementById('start-ar-btn');
            const errorMsg = document.getElementById('error-message');
            const overlay = document.getElementById('permission-overlay');
            
            // 顯示載入狀態
            startBtn.innerHTML = '請求權限中...<span class="spinner"></span>';
            startBtn.disabled = true;
            errorMsg.classList.remove('show');

            try {
                // 檢查是否為 iOS 13+ 需要權限
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    // iOS 13+ 需要明確請求權限
                    const motionPermission = await DeviceMotionEvent.requestPermission();
                    const orientationPermission = typeof DeviceOrientationEvent.requestPermission === 'function' 
                        ? await DeviceOrientationEvent.requestPermission()
                        : 'granted';

                    if (motionPermission === 'granted' && orientationPermission === 'granted') {
                        permissionGranted = true;
                        console.log('✅ 裝置感應器權限已獲得');
                        startARExperience();
                    } else {
                        throw new Error('權限被拒絕');
                    }
                } else {
                    // 非 iOS 或舊版本，直接啟動
                    permissionGranted = true;
                    console.log('✅ 不需要權限請求，直接啟動');
                    startARExperience();
                }
            } catch (error) {
                console.error('❌ 權限請求失敗:', error);
                // 顯示錯誤訊息和重試按鈕
                startBtn.innerHTML = '重試';
                startBtn.disabled = false;
                errorMsg.classList.add('show');
            }
        }

        function startARExperience() {
            const overlay = document.getElementById('permission-overlay');
            const scene = document.querySelector('a-scene');
            
            // 隱藏權限遮罩
            overlay.classList.add('hidden');
            
            // 顯示 AR 場景
            if (scene) {
                scene.classList.add('ready');
            }
            
            console.log('🎯 AR 體驗已啟動');
        }

        // 函數：獲取指定名稱的 cookie 值
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        $(document).ready(function () {
            let targetFoundOnce = false;
            // Django 模板變數注入
            let level = "{{ level }}";
            let phone = getCookie('phone');
            let mainurl = "https://tdance.fansee.studio/trips/api/post-detail/";

            console.log('[AR Scan] Level:', level, 'Phone:', phone);

            // 事件：檢測到目標
            var mindarEntity = document.querySelector('a-entity[mindar-image-target]');
            mindarEntity.addEventListener('targetFound', function (event) {
                if (!targetFoundOnce) {
                    targetFoundOnce = true;

                    // 獲取關卡狀態
                    $.ajax({
                        url: mainurl + phone,
                        type: "GET",
                        dataType: "json",
                        success: function (data) {
                            let status = data.content[String(level)].status;
                            $('.center-box').fadeIn();

                            if (status === 'pass' || status === 'fail') {
                                $('.status-message').html('<h3>你已做出選擇，請繼續前行吧</h3>');
                                $('.center-box').fadeIn();
                            } else {
                                // 如果是null，則顯示問題和選項
                                $.ajax({
                                    url: "https://tdance.fansee.studio/trips/api/question/" + level,
                                    type: "GET",
                                    dataType: "json",
                                    success: function (Question) {
                                        var correctAnswer = Question.answer;
                                        var content = `
                                            <div class="question">${Question.question}</div>
                                            <button class="option" data-choice="A">${Question.choiceA}</button>
                                            <button class="option" data-choice="B">${Question.choiceB}</button>
                                            <button class="option" data-choice="C">${Question.choiceC}</button>
                                            <button class="option" data-choice="D">${Question.choiceD}</button>
                                            <div class="result"></div>
                                        `;
                                        $('.center-box').html(content);

                                        $('.option').click(function () {
                                            var userChoice = $(this).data('choice');
                                            var resultStatus = userChoice === correctAnswer ? 'pass' : 'fail';

                                            // 移除問題和選項按鈕
                                            $('.question, .option').remove();

                                            if (resultStatus === 'pass') {
                                                $('.result').html('<p>恭喜通關</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/correct.png?raw=true" alt="Success Image"><button onclick="window.history.back()">繼續前行</button>');
                                            } else {
                                                $('.result').html('<p>挑戰失敗</p><img src="https://github.com/tdance555/tdance2024/blob/beforeFinish/media/vendor_icons/wrong.png?raw=true" alt="Failure Image"><button onclick="window.history.back()">繼續前行</button>');
                                            }

                                            $('.result').fadeIn();

                                            // 發送 PATCH 請求更新數據
                                            $.ajax({
                                                url: `https://tdance.fansee.studio/trips/api/post/${phone}/`,
                                                type: "PATCH",
                                                contentType: "application/json",
                                                data: JSON.stringify({
                                                    level: level,
                                                    status: resultStatus,
                                                    user_answer: userChoice,
                                                    correct_answer: correctAnswer
                                                }),
                                                success: function (response) {
                                                    console.log("數據更新成功:", response);
                                                },
                                                error: function (xhr, status, error) {
                                                    console.error("更新失敗:", xhr.responseText);
                                                }
                                            });
                                        });
                                    },
                                    error: function (xhr, status, error) {
                                        console.error('AJAX request failed:', error);
                                    }
                                });
                            }
                        },
                        error: function (xhr, status, error) {
                            console.error('AJAX request failed:', error);
                        }
                    });

                    mindarEntity.removeEventListener('targetFound', arguments.callee);
                }
            });
        });
    </script>
</body>
</html>
