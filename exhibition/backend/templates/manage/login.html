<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>廠商登入/註冊</title>
</head>
<body>
    <h2>廠商登入/註冊</h2>
    <form method="post">
        <label>手機號碼：</label>
        <input type="text" name="phone" required><br>
        <label>密碼：</label>
        <input type="password" name="password" required><br>
        <button type="submit" name="action" value="login">登入</button>
        <button type="submit" name="action" value="register">註冊</button>
    </form>
</body>
</html>
