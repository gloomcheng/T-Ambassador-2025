<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>對話框遊戲</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        .hidden {
            display: none;
        }

        .clickable {
            cursor: pointer;
        }

        * {
            margin: 0 auto;
            padding: 0;
        }

        body {
            text-decoration: none;
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        a {
            text-decoration: none;
            color: #333333;
        }

        #card_1,
        #card_2,
        #card_3,
        #card_4,
        #dialogue-1{
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 80%;
            text-align: center;
            z-index: 20;
            box-sizing: border-box;
        }

        .backgroundimg {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: url("img/呱呱的家.jpg");
            background-size: cover;
            background-position: center;
        }

        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px;
            width: 80%;
            z-index: 20;
        }

        .dialogue-box img {
            position: absolute;
            top: -87%;
            left: 0;
            width: 100%;
            height: 220%;
            object-fit: fill;
            z-index: -1;
        }

        .dialogue-box>h3{
            position: relative;
            text-align: left;
            font-size: 1.2rem;
        }
        .namecard{
            background-image: url("assets/namecard.png");
            background-repeat: no-repeat;
            background-size: contain;
            height: 40px;
            margin: 10px 0%;
        }
        .cname {
            color: rgb(37, 36, 34);
            text-align: left;
            padding-left: 7px;
            padding-top: 5px;
        }

        #scene1 > h3,
        #scene2 > h3,
        #scene3 > h3,
        #scene4 > h3 {
            text-align: left;
            font-size: 1.2rem;
        }

        .options, .selection>button {
            position: relative;
            display: flex;
            justify-content: flex-end;
            background-image: url("assets/namecard.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: right;
            border: none;
            background-color: transparent;
            color: #333333;
        }

        .options button {
            padding: 10px 38px 10px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #333333;
        }

        .choices {
            position: absolute;
            top: 17%;
            left: 42%;
            justify-content: center;
            align-items: center;
        }

        .continue-btn {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            padding: 10px 20px;
        }

        .choices button {
            width: 300px;
            margin: 3% 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 60px;
            cursor: pointer;
        }

        .selection {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .selection > #optionA,
        .selection > #optionB,
        .selection > #optionC {
            padding: 1% 4%;
            margin: 0 2%;
        }

        #character,
        #scene4>img {
            position: absolute;
            top: -205%;
            left: -6%;
            width: 24%;
        }
        /* nest hub max */
        @media (max-width: 1280px) {
        .dialogue-box{
            padding: 3%;
        }
        .dialogue-box img {
            top: -34%;
            left: 0;
            height: 148%;

        }
        #character, #scene4>img {
            top: -130%;
            left: -10%;
            width: 44%;
        }
        .dialogue-box {
            top: 70%;
            left: 50%;
        }

        .dialogue-box>h3 {
            font-size: 1.2rem;
        }
        .selection{
            margin-top: 3%;
        }
        .selection>#optionA, .selection > #optionB, .selection > #optionC{
            padding: 2% 8%;
        }
    }
        /* nest hub */
        @media (max-width: 1024px) {
        #character, #scene4>img {
            width: 40%;
            top: -126%;
            height: 130%;
            left: -8%;

        }
        .dialogue-box img{
            height: 160%;
        }
        .selection{
            margin-top: 4%;
        }
        .selection>#optionA, .selection > #optionB, .selection > #optionC{
            padding: 3% 10%;
        }
        }
        @media (max-width: 924px) {
            #character, #scene4>img{
                top: -103%;
                left: -21%;
                width: 90%;
                height: 105%;
            }
            .dialogue-box img{
                height: 130%;
            }
            .selection > #optionA, .selection > #optionB, .selection > #optionC{
                padding: 4% 8%;
                margin: 0 2%;
            }
        }
        @media (max-width: 768px) {
            .dialogue-box {
                top: 57%;
            }
            .dialogue-box>img{
                height: 130%;
            }
            #character, #scene4>img{
                top: -97%;
                left: -17%;
                width: 75%;
                height: 104%;
            }
        }

        @media (max-width: 576px) {
            .dialogue-box {
                height: 240px;
                font-size: 1.1rem;
            }
            .selection{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            #character, #scene4>img{
                left: -9%;
                width: 60%;
            }
            .dialogue-box img{
                height: 220%;
            }
            #card_1, #card_2, #card_3, #card_4, #dialogue-1{
                top: 50%;
            }
            .cname{
                padding-left: 19px;
                padding-top:7px;

            }
        }

        @media (max-width: 480px) {
            .dialogue-box {
                left: 11%;
                top: 47%;
                width: 80%;
                height: 300px;
            }
        }

        /* samsung galaxy a51/a71 */
        @media (max-width: 440px) {
            .dialogue-box {
                top: 60%;
        }
            .dialogue-box>h3{
                font-size: 1rem;
            }
            #scene1 > h3, #scene2 > h3, #scene3 > h3, #scene4 > h3{
                font-size:1rem;
            }
            #character,#scene4>img{
                top: -77%;
                left: -24%;
                width: 116%;
                height: 85%;
            }
            .dialogue-box>img{
                height: 114%;
                top: -19%;
            }
            
            .selection > #optionA, .selection > #optionB, .selection > #optionC {
                padding: 2% 10%;
                margin: 2%;
            }
            #card_1, #card_2, #card_3, #card_4, #dialogue-1{
                top:65%;
            }
        }       
    </style>
</head>

<body>
    <div id="game-container">
        <div class="backgroundimg"></div>
        <div class="dialogue-box" id="dialogue-1">
            <img src="assets/dialogbox.png" alt="dialogbox background">
            <h3>歡迎使用本AR導覽系統！本園區共有五個作品景點，透過掃描崙港的圖片，您將能夠在手機畫面中即時呈現相關歷史、藝術及文化資訊，讓您更深入了解崙港的精髓。希望您能享受這次的導覽之旅。</h3>
            <div class="options">
                <button id="continue-btn">請點選按鈕繼續</button>
            </div>
        </div>
        <div id="card_1" class="hidden dialogue-box clickable">
            <img src="assets/dialogbox.png" alt="dialogbox background">
            <div id="scene1">
                <img id="character" src="assets/啵啵鴨_去背.png" alt="">
                <div class="namecard">
                    <h3 class="cname">導覽員-啵啵鴨</h3>
                </div>
                <h3 class="dialog">你好呀！我是導覽員啵啵鴨~歡迎來到崙港社區！</h3>
                <div class="options">
                    <button class="next-btn" data-next="card_2">請點選按鈕繼續</button>
                </div>
            </div>
        </div>
        <div id="card_2" class="hidden dialogue-box">
            <img src="assets/dialogbox.png" alt="dialogbox background">
            <div id="scene2">
                <img id="character" src="assets/啵啵鴨_去背.png" alt="">
                <div class="namecard">
                    <h3 class="cname">導覽員-啵啵鴨</h3>
                </div>
                <h3 class="dialog">你對崙港的第一印象是什麼？</h3>
                <div class="selection">
                    <button id="optionA" data-message="歡迎你來崙港~" data-next="card_3">A. 充滿農村風情</button>
                    <button id="optionB" data-message="歡迎你來崙港~" data-next="card_3">B. 可愛的鴨子與文創</button>
                    <button id="optionC" data-message="歡迎你來崙港~" data-next="card_3">C. 古色古香的老屋</button>
                </div>
            </div>
        </div>
        <div id="card_3" class="hidden dialogue-box">
            <img src="assets/dialogbox.png" alt="dialogbox background">
            <div id="scene2">
                <img id="character" src="assets/啵啵鴨_去背.png" alt="">
                <div class="namecard">
                    <h3 class="cname">導覽員-啵啵鴨</h3>
                </div>
                <h3 class="dialog" id="message"></h3>
                <div class="options">
                    <button class="next-btn" data-next="card_4">請點選按鈕繼續</button>
                </div>
            </div>
        </div>
        <div id="card_4" class="hidden dialogue-box">
            <img src="assets/dialogbox.png" alt="dialogbox background">
            <div id="scene4">
                <img src="assets/啵啵鴨_去背.png" alt="">
                <div class="namecard">
                    <h3 class="cname">導覽員-啵啵鴨</h3>
                </div>
                <h3 class="dialog">親愛的大玩家和小玩家們，你們終於來啦！這裡是充滿陽光和笑聲的崙港，也是小鴨我最喜歡的地方，讓我們一起來探索呱呱的家園吧!</h3>
                <div class="options">
                    <button class="next-btn"><a href="arGuide.html">請點選按鈕繼續</a></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function playAudio(audioSrc) {
            const audio = new Audio(audioSrc);
            audio.play();
        }

        document.getElementById('continue-btn').addEventListener('click', function () {
            document.getElementById('dialogue-1').classList.add('hidden');
            document.getElementById('card_1').classList.remove('hidden');
            playAudio('assets/崙港相關音檔/introduce導覽員介紹.mp3'); // Play the audio for card 1
        });

        document.querySelectorAll('.next-btn').forEach(button => {
            button.addEventListener('click', function () {
                const nextCard = button.getAttribute('data-next');
                button.closest('.dialogue-box').classList.add('hidden');
                document.getElementById(nextCard).classList.remove('hidden');

                // Play the corresponding audio for each card
                if (nextCard === 'card_4') {
                    playAudio('assets/崙港相關音檔/go前往導覽.mp3'); // Play the audio for card 4
                }
            });
        });

        document.querySelectorAll('.selection button').forEach(button => {
            button.addEventListener('click', function () {
                const message = button.getAttribute('data-message');
                document.getElementById('message').innerText = message;
                const nextCard = button.getAttribute('data-next');
                button.closest('.dialogue-box').classList.add('hidden');
                document.getElementById(nextCard).classList.remove('hidden');
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
