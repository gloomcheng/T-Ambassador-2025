name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          # 使用 base64 解碼密鑰（最可靠的方式）
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # 驗證密鑰格式
          if ! ssh-keygen -l -f ~/.ssh/deploy_key; then
            echo "❌ 密鑰格式錯誤"
            echo "密鑰內容前 5 行："
            head -5 ~/.ssh/deploy_key
            exit 1
          fi
          
          echo "✅ 密鑰格式正確"
          
          # 添加 known hosts
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # 配置 SSH
          cat >> ~/.ssh/config << 'EOF'
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            PubkeyAuthentication yes
            PasswordAuthentication no
          EOF
          chmod 600 ~/.ssh/config
          
          # 測試連線
          echo "🔗 測試 SSH 連線..."
          if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 deploy-server "echo '✅ SSH 連線測試成功'"; then
            echo "✅ SSH 連線正常"
          else
            echo "❌ SSH 連線失敗"
            exit 1
          fi

      - name: 🚀 Deploy to server
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          echo "🔄 開始部署到生產伺服器..."
          
          # 部署 exhibition 目錄
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            --exclude='.cortex' \
            --exclude='langchain/.cortex' \
            --exclude='*.log' \
            --exclude='db.sqlite3' \
            exhibition/ deploy-server:$SSH_PATH/exhibition/
          
          echo "✅ 文件同步完成"

      - name: 🔧 Restart services on server
        run: |
          ssh -i ~/.ssh/deploy_key deploy-server << 'EOF'
            echo "🔄 重啟 Django 服務..."
            
            # 進入專案目錄
            cd /var/www/sites/T-Ambassador-2025/exhibition/backend
            
            # 收集靜態文件
            python3 manage.py collectstatic --noinput || true
            
            # 執行資料庫遷移
            python3 manage.py migrate --noinput || true
            
            # 重啟 Apache/Django 服務
            sudo systemctl restart apache2 || true
            
            echo "✅ 服務重啟完成"
          EOF

      - name: 📊 Deployment summary
        if: success()
        run: |
          echo "🎉 部署成功！"
          echo "📅 時間: $(date)"
          echo "🌐 URL: https://tdance.fansee.studio"
          echo "📝 提交: ${{ github.sha }}"

      - name: ⚠️ Deployment failed
        if: failure()
        run: |
          echo "❌ 部署失敗！"
          echo "請檢查日誌並手動部署。"

