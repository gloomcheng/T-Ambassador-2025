LoadModule wsgi_module "/var/www/sites/T-Ambassador-2025/exhibition/backend/.venv/lib/python3.11/site-packages/mod_wsgi/server/mod_wsgi-py311.cpython-311-x86_64-linux-gnu.so"
WSGIPythonHome "/var/www/sites/T-Ambassador-2025/exhibition/backend/.venv"

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tdance.fansee.studio
    ServerAdmin contact@tdance.fansee.studio
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # LINE Bot Webhook (Node.js proxy) - MUST be before WSGI
    <Location /webhook>
        ProxyPass http://127.0.0.1:3000/webhook
        ProxyPassReverse http://127.0.0.1:3000/webhook
        ProxyPreserveHost On
    </Location>

    # Static files (Django collectstatic output)
    Alias /static /var/www/sites/T-Ambassador-2025/exhibition/backend/staticfiles
    <Directory /var/www/sites/T-Ambassador-2025/exhibition/backend/staticfiles>
        Require all granted
    </Directory>

    # Media files
    Alias /media /var/www/sites/T-Ambassador-2025/exhibition/backend/media
    <Directory /var/www/sites/T-Ambassador-2025/exhibition/backend/media>
        Require all granted
    </Directory>

    # WSGI設定 (Django) - MUST be after /webhook
    WSGIScriptAlias / /var/www/sites/T-Ambassador-2025/exhibition/backend/mysite/wsgi.py
    <Directory /var/www/sites/T-Ambassador-2025/exhibition/backend/mysite>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    SSLCertificateFile /etc/letsencrypt/live/tdance.fansee.studio/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tdance.fansee.studio/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

